[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifls-classifier"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.18",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ifls*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
