data:
  csv_path: "data/products.csv"
  # Expected CSV columns: product_name, group_id, family_id, subfamily_id, segment_id
  text_column: "product_name"
  hierarchy_json: "data/hierarchy.json"
  encoders_dir: "data/encoders"
  train_ratio: 0.80
  calib_ratio: 0.10
  # test_ratio is implicitly 1 - train - calib
  random_seed: 42
  # max_rows: Set this to train only on a maximum set of rows (test only)

model:
  backbone: "distilbert-base-uncased"
  max_length: 32
  # LoRA
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.1
  lora_target_modules: ["q_lin", "v_lin"]

training:
  output_dir: "models"
  batch_size: 16
  learning_rate: 2.0e-4
  epochs: 4
  fp16: true
  dataloader_num_workers: 0
  save_total_limit: 2
  warmup_ratio: 0.02
  # Label smoothing prevents overconfidence — important for the human-review fallback
  label_smoothing: 0.1

calibration:
  temperature_lr: 0.01
  temperature_max_iter: 50
  temperature_output: "models/best/temperature.pt"

inference:
  # Minimum confidence below which prediction is flagged as uncertain
  confidence_threshold: 0.5
